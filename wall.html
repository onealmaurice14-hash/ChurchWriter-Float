<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Before I am</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#0a1236;overflow:hidden;cursor:none}canvas{display:block;width:100vw;height:100vh}</style></head><body>
<canvas id="w"></canvas>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="store.js"></script>
<script>
const cv=document.getElementById("w"),ctx=cv.getContext("2d"),MAX=40,GAP=70,SPEED=1.2;
let W,H,D,sprites=[],strip=[],off=0,bg,clouds=[],stars=[],motes=[],cloudImg;
const rnd=(a,b)=>a+Math.random()*(b-a);
const stripH=()=>Math.max(80,H*.11);

function makeCloud(){const c=document.createElement("canvas");c.width=640;c.height=260;const x=c.getContext("2d");
  for(let i=0;i<16;i++){const cx=rnd(110,530),cy=rnd(95,170),r=rnd(50,115),g=x.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,"rgba(255,255,255,.5)");g.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill()}
  return c}
function build(){
  bg=document.createElement("canvas");bg.width=W;bg.height=H;const b=bg.getContext("2d");
  const g=b.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#070d2e");g.addColorStop(.4,"#1f3484");g.addColorStop(.75,"#6f86cf");g.addColorStop(1,"#f2dcae");
  b.fillStyle=g;b.fillRect(0,0,W,H);
  const h=b.createRadialGradient(W/2,H*1.05,0,W/2,H*1.05,H*.95);
  h.addColorStop(0,"rgba(255,238,190,.9)");h.addColorStop(1,"rgba(255,238,190,0)");b.fillStyle=h;b.fillRect(0,0,W,H);
  cloudImg=makeCloud();
  clouds=Array.from({length:10},()=>({x:rnd(-640,W),y:rnd(H*.5,H*.92),s:rnd(.9,2),v:rnd(.12,.4),a:rnd(.5,.95)}));
  stars=Array.from({length:110},()=>({x:rnd(0,W),y:rnd(0,H*.5),r:rnd(.5,1.6),p:rnd(0,6.3),f:rnd(.0006,.0018)}));
  motes=Array.from({length:45},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(1,2.6),v:rnd(.1,.35),p:rnd(0,6.3)}));
}
function size(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);build()}
addEventListener("resize",size);size();

function add(m){const img=new Image();img.onload=()=>{
  const h=Math.min(H*.2,200),sc=h/img.height;
  sprites.push({id:m.id,img,w:img.width*sc,h,x:rnd(0,W*.85),y:rnd(H*.05,H*.7),vx:rnd(-.35,.35)||.2,vy:rnd(-.25,.25)||.15,r:rnd(-.15,.15),vr:rnd(-.0005,.0005),born:performance.now()});
  if(sprites.length>MAX)sprites.shift();
  strip.push({id:m.id,img,a:img.width/img.height});if(strip.length>MAX)strip.shift();
};img.src=m.png}
const del=m=>{sprites=sprites.filter(s=>s.id!==m.id);strip=strip.filter(s=>s.id!==m.id)};
Store.list(MAX).then(l=>l.forEach(add));Store.onInsert(add);Store.onDelete(del);

function frame(now){
  ctx.drawImage(bg,0,0,W,H);
  // stars
  for(const s of stars){ctx.globalAlpha=.35+.65*Math.abs(Math.sin(now*s.f+s.p));ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}
  // light rays from above, swaying slowly
  const ox=W/2,oy=-H*.15,rg=ctx.createLinearGradient(0,oy,0,H);rg.addColorStop(0,"rgba(255,244,205,.22)");rg.addColorStop(1,"rgba(255,244,205,0)");
  ctx.fillStyle=rg;ctx.globalAlpha=.65+.35*Math.sin(now/3200);
  for(let i=0;i<13;i++){const a=Math.PI/2+(i-6)*.12+Math.sin(now/9000+i)*.025,w=.022+.015*((i*7)%3),L=H*2;
    ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+Math.cos(a-w)*L,oy+Math.sin(a-w)*L);ctx.lineTo(ox+Math.cos(a+w)*L,oy+Math.sin(a+w)*L);ctx.fill()}
  // clouds drifting right
  for(const c of clouds){c.x+=c.v;if(c.x>W)c.x=-640*c.s;ctx.globalAlpha=c.a;ctx.drawImage(cloudImg,c.x,c.y,640*c.s,260*c.s)}
  // rising golden motes
  ctx.fillStyle="#fff0c0";for(const m of motes){m.y-=m.v;if(m.y<-5){m.y=H+5;m.x=rnd(0,W)}ctx.globalAlpha=.25+.5*Math.abs(Math.sin(now/1400+m.p));ctx.beginPath();ctx.arc(m.x+Math.sin(now/2000+m.p)*12,m.y,m.r,0,7);ctx.fill()}
  ctx.globalAlpha=1;

  const sh=stripH(),floor=H-sh;
  for(const s of sprites){
    s.x+=s.vx;s.y+=s.vy;s.r+=s.vr;
    if(s.x<0||s.x+s.w>W)s.vx*=-1;if(s.y<20||s.y+s.h>floor-10)s.vy*=-1;
    ctx.save();ctx.globalAlpha=Math.min(1,(now-s.born)/1800);ctx.shadowColor="rgba(255,236,170,.95)";ctx.shadowBlur=16;
    ctx.translate(s.x+s.w/2,s.y+s.h/2);ctx.rotate(s.r);ctx.drawImage(s.img,-s.w/2,-s.h/2,s.w,s.h);ctx.restore();
  }
  // marquee: glass band, scrolling to the right
  ctx.fillStyle="rgba(8,14,50,.55)";ctx.fillRect(0,floor,W,sh);
  ctx.fillStyle="rgba(255,236,170,.6)";ctx.fillRect(0,floor,W,1.5);
  if(strip.length){
    const ih=sh*.7,items=strip.map(s=>({s,w:ih*s.a})),total=items.reduce((t,i)=>t+i.w+GAP,0);
    off=(off+SPEED)%total;let x=off-total;
    ctx.save();ctx.beginPath();ctx.rect(0,floor,W,sh);ctx.clip();
    while(x<W){for(const i of items){if(x+i.w>0&&x<W)ctx.drawImage(i.s.img,x,floor+(sh-ih)/2,i.w,ih);x+=i.w+GAP}}
    ctx.restore();
  }
  // centered title, always on top
  const fs=Math.min(W*.1,170),cy=floor/2;
  const hl=ctx.createRadialGradient(W/2,cy,0,W/2,cy,fs*3);hl.addColorStop(0,"rgba(255,244,210,.28)");hl.addColorStop(1,"rgba(255,244,210,0)");
  ctx.fillStyle=hl;ctx.fillRect(0,cy-fs*3,W,fs*6);
  ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`italic 600 ${fs}px "Cormorant Garamond",Georgia,serif`;
  ctx.shadowColor="rgba(10,20,80,.55)";ctx.shadowBlur=30;ctx.shadowOffsetY=4;ctx.fillStyle="#fffdf5";ctx.fillText("Before I am",W/2,cy);
  ctx.shadowColor="rgba(255,226,140,.9)";ctx.shadowBlur=50;ctx.shadowOffsetY=0;ctx.fillText("Before I am",W/2,cy);ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener("click",()=>document.documentElement.requestFullscreen?.());
</script></body></html>
