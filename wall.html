<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Before I am</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#0d1020;overflow:hidden;cursor:none}canvas{display:block;width:100vw;height:100vh}</style></head><body>
<canvas id="w"></canvas>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="store.js"></script>
<script>
const cv=document.getElementById("w"),ctx=cv.getContext("2d"),MAX=40,LANES=4,GAP=90;
let W,H,D,laneH;
const lanes=Array.from({length:LANES},(_,i)=>({items:[],off:0,speed:70+i*14+(i%2)*10}));
function size(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);laneH=Math.min(H*.15,160)}
addEventListener("resize",size);size();

function add(m){const img=new Image();img.onload=()=>{
  const lane=lanes.reduce((a,b)=>b.items.length<a.items.length?b:a);
  lane.items.push({id:m.id,img,a:img.width/img.height,born:performance.now()});
  if(lanes.reduce((t,l)=>t+l.items.length,0)>MAX){const big=lanes.reduce((a,b)=>b.items.length>a.items.length?b:a);big.items.shift()}
};img.src=m.png}
const del=m=>lanes.forEach(l=>l.items=l.items.filter(i=>i.id!==m.id));
Store.list(MAX).then(l=>l.forEach(add));Store.onInsert(add);Store.onDelete(del);

let prev=0;
function frame(now){
  const dt=Math.min(.05,(now-prev)/1000||0);prev=now;
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,"#1b2040");g.addColorStop(1,"#070810");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  lanes.forEach((lane,li)=>{
    const n=lane.items.length;if(!n)return;
    const cy=H*(li+.5)/LANES,ws=lane.items.map(i=>Math.min(laneH*i.a,W*.4));
    const sum=ws.reduce((t,w)=>t+w,0),pad=Math.max(GAP,(W*1.1-sum)/n),total=sum+pad*n;
    lane.off=(lane.off+lane.speed*dt)%total;      // moves left to right, loops forever
    let x=lane.off-total;
    ctx.save();ctx.shadowColor="#f3d98b";ctx.shadowBlur=12;
    while(x<W){for(let k=0;k<n;k++){const it=lane.items[k],w=ws[k],h=w/it.a;
      if(x+w>0&&x<W){ctx.globalAlpha=Math.min(1,(now-it.born)/1500);ctx.drawImage(it.img,x,cy-h/2,w,h)}
      x+=w+pad}}
    ctx.restore();
  });

  const fs=Math.min(W*.1,170);
  ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`italic 600 ${fs}px "Cormorant Garamond",Georgia,serif`;
  ctx.shadowColor="#f3d98b";ctx.shadowBlur=40;ctx.fillStyle="#fffaf0";ctx.fillText("Before I am",W/2,H/2);ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener("click",()=>document.documentElement.requestFullscreen?.());
</script></body></html>
