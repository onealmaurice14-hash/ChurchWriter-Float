<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Write your message</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--night:#0d1020;--gold:#f3d98b;--paper:#fffdf6}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--night);color:var(--gold);font-family:"Cormorant Garamond",Georgia,serif;overscroll-behavior:none;touch-action:none;user-select:none}
body{display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));gap:12px}
h1{margin:0;font-size:clamp(28px,5vw,48px);font-style:italic;font-weight:500;text-align:center}
#paper{flex:1;min-height:0;background:var(--paper);border-radius:6px;box-shadow:0 0 60px #f3d98b33;position:relative}
canvas{width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;inset:0;display:grid;place-items:center;color:#0d102055;font-size:clamp(22px,4vw,36px);font-style:italic;pointer-events:none}
.row{display:flex;gap:12px}
button{flex:1;font:inherit;font-size:clamp(22px,4vw,30px);padding:14px;border-radius:6px;border:2px solid var(--gold);background:none;color:var(--gold)}
button.go{background:var(--gold);color:var(--night)}button:disabled{opacity:.4}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#toast{position:fixed;inset:0;display:grid;place-items:center;background:#0d1020ee;font-size:clamp(34px,7vw,64px);font-style:italic;opacity:0;pointer-events:none;transition:opacity .4s}
#toast.on{opacity:1}
</style></head><body>
<h1>Write your message</h1>
<div id="paper"><canvas id="c"></canvas><div id="hint">write here with your finger or pen</div></div>
<div class="row"><button id="clr">Clear</button><button id="save" class="go" disabled>Send to the wall</button></div>
<div id="toast">Sent. Look up.</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="store.js"></script>
<script>
const $=id=>document.getElementById(id),cv=$("c"),ctx=cv.getContext("2d"),D=devicePixelRatio||1;
let bb,last,drawing=false;
function size(){const r=cv.getBoundingClientRect();cv.width=r.width*D;cv.height=r.height*D;ctx.lineCap=ctx.lineJoin="round";ctx.lineWidth=5*D;ctx.strokeStyle="#000"}
function reset(){ctx.clearRect(0,0,cv.width,cv.height);bb=null;$("save").disabled=true;$("hint").style.display=""}
size();reset();addEventListener("orientationchange",()=>setTimeout(()=>{size();reset()},300));
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*D,(e.clientY-r.top)*D]};
function grow(x,y){bb=bb?[Math.min(bb[0],x),Math.min(bb[1],y),Math.max(bb[2],x),Math.max(bb[3],y)]:[x,y,x,y]}
cv.addEventListener("pointerdown",e=>{drawing=true;cv.setPointerCapture(e.pointerId);last=pt(e);grow(...last);ctx.beginPath();ctx.arc(...last,ctx.lineWidth/2,0,7);ctx.fillStyle="#000";ctx.fill();$("hint").style.display="none";$("save").disabled=false});
cv.addEventListener("pointermove",e=>{if(!drawing)return;const p=pt(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();grow(...p);last=p});
["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,()=>drawing=false));
$("clr").onclick=reset;
$("save").onclick=async()=>{
  if(!bb)return;$("save").disabled=true;
  const pad=24*D,x=Math.max(0,bb[0]-pad),y=Math.max(0,bb[1]-pad),w=Math.min(cv.width,bb[2]+pad)-x,h=Math.min(cv.height,bb[3]+pad)-y;
  // Background removal: the canvas is transparent, so only ink has alpha. Recolor ink to warm light for the dark wall.
  const img=ctx.getImageData(x,y,w,h),d=img.data;
  for(let i=0;i<d.length;i+=4){d[i]=255;d[i+1]=244;d[i+2]=214}
  const t=document.createElement("canvas");t.width=w;t.height=h;t.getContext("2d").putImageData(img,0,0);
  const s=Math.min(1,700/w),o=document.createElement("canvas");o.width=Math.round(w*s);o.height=Math.round(h*s);
  o.getContext("2d").drawImage(t,0,0,o.width,o.height);
  try{await Store.add(o.toDataURL("image/png"));$("toast").classList.add("on");setTimeout(()=>{$("toast").classList.remove("on");reset()},1800)}
  catch(err){alert("Could not send. Check the WiFi and try again.");$("save").disabled=false}
};
</script></body></html>
